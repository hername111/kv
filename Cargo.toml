[workspace]
resolver = "2"
members = [
    "crates/kv-common",
    "crates/kv-storage",
    "crates/kv-sql",
    "crates/kv-txn",
    "crates/kv-network",
    "crates/kv-server",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license = "MIT"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
thiserror = "2"
bytes = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"

tempfile = "3"

[workspace.lints.rust]
unsafe_code = "forbid"
unused_lifetimes = "warn"
unused_qualifications = "warn"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
